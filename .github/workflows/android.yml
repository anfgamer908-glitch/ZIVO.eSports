name: Build ZIVO eSports APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/zivo/esports
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html
          cp zivo_logo.png app/src/main/res/drawable/zivo_logo.png
          cp styles.xml app/src/main/res/values/styles.xml
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ZIVO eSports'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zivo.esports'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zivo.esports'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/java/com/zivo/esports/MainActivity.java <<'EOF'
          package com.zivo.esports;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          import android.content.Intent;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  web.setWebViewClient(new WebViewClient());

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<android.net.Uri[]> callback,
                              FileChooserParams params) {

                          Intent intent = params.createIntent();
                          try {
                              startActivityForResult(intent, 1001);
                              fileCallback = callback;
                          } catch (Exception e) {
                              return false;
                          }
                          return true;
                      }
                  });

                  web.loadUrl("file:///android_asset/index.html");
              }

              private ValueCallback<android.net.Uri[]> fileCallback;

              @Override
              protected void onActivityResult(
                      int requestCode, int resultCode, Intent data) {

                  if (requestCode == 1001 && fileCallback != null) {
                      android.net.Uri[] results =
                          WebChromeClient.FileChooserParams.parseResult(
                              resultCode, data);

                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }

                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack())
                      web.goBack();
                  else
                      super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIVO-eSports-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
